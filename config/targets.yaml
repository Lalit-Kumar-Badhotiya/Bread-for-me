# ============================================================
#  TARGETING — filled from your answers on 2026-10-18.
#  Titles are checked as case-insensitive substrings of the
#  posting title, so "sde" also matches "SDE Intern" etc.
#  Tune freely during calibration week.
# ============================================================

titles:
  - SDE
  - Software Development Engineer
  - Software Engineer
  - Backend Developer
  - Backend Engineer
  - Software Developer
  - Junior Software Developer
  - Junior Software Engineer
  - SDE Intern
  - Software Engineer Intern

must_have_skills: []     # title-driven targeting; add e.g. [python] to tighten

bonus_skills:
  - python
  - java
  - javascript
  - sql
  - rest api
  - node
  - react
  - git

exclude_keywords:
  - senior
  - lead
  - manager
  - architect
  - principal
  - director
  - "12+ years"
  - "10+ years"

locations:               # "delhi" also matches New Delhi/Gurugram/Noida via substring
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - chennai
  - noida
  - delhi
  - mumbai
  - mathura
  - remote

min_score: 70            # queue threshold; drop to 60-65 if queue feels too small
max_age_days: 7
