# ============================================================
#  TARGETING — filled from your answers on 2026-10-18.
#  Titles are checked as case-insensitive substrings of the
#  posting title, so "sde" also matches "SDE Intern" etc.
#  Tune freely during calibration week.
# ============================================================

titles:
  - SDE
  - Software Development Engineer
  - Software Engineer
  - Backend Developer
  - Backend Engineer
  - Software Developer
  - Junior Software Developer
  - Junior Software Engineer
  - SDE Intern
  - Software Engineer Intern

must_have_skills: [javascript]  # from resume — posting must mention JS somewhere (all listed skills are required; keep this list short)

bonus_skills:
  - python
  - java
  - javascript
  - typescript
  - sql
  - rest api
  - node
  - react
  - next.js
  - nextjs
  - express
  - postgres
  - mongodb
  - docker
  - git

exclude_keywords:
  - senior
  - lead
  - manager
  - architect
  - principal
  - director
  - unpaid
  - "12+ years"
  - "10+ years"

locations:               # "delhi" also matches New Delhi/Gurugram/Noida via substring
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - chennai
  - noida
  - delhi
  - mumbai
  - mathura
  - remote

min_score: 65            # queue threshold; drop to 60-65 if queue feels too small
experience_band: junior  # fresher=0-1, junior=0-3, mid=2-5 (posts above band rejected)
max_age_days: 14
