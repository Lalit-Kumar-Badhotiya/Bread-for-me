# ============================================================
#  TARGETING — filled from your answers on 2026-10-18.
#  Titles are checked as case-insensitive substrings of the
#  posting title, so "sde" also matches "SDE Intern" etc.
#  Tune freely during calibration week.
# ============================================================

titles:
  - SDE
  - Software Development Engineer
  - Software Engineer
  - Backend Developer
  - Backend Engineer
  - Software Developer
  - Junior Software Developer
  - Junior Software Engineer
  - SDE Intern
  - Software Engineer Intern

must_have_skills: []  # AND-gate: posting must mention EVERY listed skill (empty = off)
must_have_any: [javascript, typescript, node, react, express, next.js, nextjs]  # OR-gate from resume: posting must mention at least one of these

bonus_skills:
  - python
  - java
  - javascript
  - typescript
  - sql
  - rest api
  - node
  - react
  - next.js
  - nextjs
  - express
  - postgres
  - mongodb
  - docker
  - git

exclude_keywords:
  - senior
  - sr
  - staff
  - lead
  - manager
  - architect
  - principal
  - director
  - unpaid
  - "12+ years"
  - "10+ years"
  - ".net"
  - "asp.net"
  - dotnet
  - "dot net"

locations:               # "delhi" also matches New Delhi/Gurugram/Noida via substring
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - chennai
  - noida
  - delhi
  - mumbai
  - mathura
  - remote

min_score: 65            # queue threshold; drop to 60-65 if queue feels too small
experience_band: fresher  # ZERO-experience policy: any posting stating 1+ required
                          # years ("3-6 Yrs", "3 years of experience", "3+ yrs"...)
                          # is rejected. fresher=0, junior=3, mid=5
fresher_signal_required: true  # strict: only queue postings that explicitly target
                               # zero-experience candidates (says fresher / "0-x Yrs" /
                               # entry level / trainee / graduate / intern / no experience)
max_age_days: 14
