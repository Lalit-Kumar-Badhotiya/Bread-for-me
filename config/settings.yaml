# ============================================================
#  GLOBAL SETTINGS — tune behavior without touching code
#  Load distribution: naukri is the volume engine; the indeed group
#  shares one conservative budget (they run the same backend/anti-bot),
#  linkedin stays MANUAL. wellfound was removed 2026-10-19 (see below).
# ============================================================

run:
  business_hours_only: true
  start_hour: 9        # applications happen between 9:00 and 19:00 local
  end_hour: 19
  headless: false      # keep false: headless windows can't be watched, don't
                       # exist in the taskbar, and can't be repaired manually
  browser_window: minimized  # Chrome launches minimized to the taskbar (no
                             # screen takeover, never jumps monitors).
                             # It NEVER pops to the foreground — action-needed
                             # steps (login, Cloudflare) arrive as a desktop
                             # toast/Telegram ping; click the taskbar icon
                             # yourself when convenient and minimize again.
                             # Set browser_window: "normal" + pop_on_action:
                             # true ONLY if you want the old pop-up behavior.
  pop_on_action: false       # never restore the window for login/captcha
                             # steps (true = the old pop-up-for-hands flow)
  interactive_learning: true  # wizard stuck on an unknown screening question? ask
                              # in the terminal, save it to answers.yaml, retry once
                              # (disable per-run with --no-learn for unattended runs)
  external_autofill: true     # apply flows that hop to a company ATS (lever,
                              # greenhouse, zohorecruit, workday, darwinbox,
                              # google-forms, ...) or any page carrying a real
                              # application form get autofilled automatically
                              # instead of parking as "external apply flow".
                              # Un-fillable ones still park with the reason.

pacing:
  min_action_delay_sec: 4   # human-like random pauses between form actions
  max_action_delay_sec: 10

limits:
  daily_total_cap: 100      # all sites combined (25 per enabled site)
  indeed_group_cap: 75      # indeed+glassdoor+simplyhired COMBINED (25 each)
  max_wizard_steps: 30      # safety stop inside an apply flow
  login_manual_wait_min: 10 # how long to wait while you log in manually
  captcha_manual_wait_min: 5 # how long to wait while YOU click "Verify you
                             # are human" (Cloudflare) in the open window
  per_job_budget_sec: 300   # one apply flow may never exceed this wall-clock time
  apply_chunk_size: 8       # process jobs in chunks; the browser is reopened between chunks
  validate_after_fetch: 8   # after fetch, sweep this many top queue rows for dead listings (0=off)
  circuit_breaker_streak: 3 # stop a run after N consecutive needs_you/failed jobs (0=off)

# Daily caps per site. enabled=false = skipped; flip on phase by phase.
# pages_per_title (where supported) fetches listing pages 1..N for each title:
#   naukri    uses -2/-3 URL suffixes (live-verified)
#   glassdoor uses _IP2/_IP3 suffixes + the entry-level filter (live-verified)
#   indeed    entry-level filter only; its pagination hits a login wall
# wellfound + indeed-group cards often omit experience/skills: such rows queue
# tentatively and get a full-page check right before applying (1+ years or a
# missing must-have skill -> skipped, never submitted).
# browser_channel (chrome/msedge) runs that site in the installed browser
# instead of bundled Chromium — needed where Cloudflare flags Chromium
# (Indeed). The profile dir is the same, so logins stick.
sites:
  # naukri joined verify_on_detail on 2026-10-19: card badges can be stale and
  # the JD header chip ("3 - 8 years") is the authoritative requirement.
  naukri:      { enabled: true,  daily_cap: 25, max_titles_per_run: 30, pages_per_title: 3, verify_on_detail: true }  # cap restored 2026-10-26 (the approved +25 was consumed earlier that day)
  # REMOVED 2026-10-19: wellfound skews international (US/EU remote startups);
  # 178 fetches yielded 0 applications, and the only jobs that reached the
  # form were location-ineligible for an India profile (wellfound blocks the
  # whole form: "does not support the locations or timezones"). Flip enabled
  # back to true if you ever want it again — the code is still here.
  wellfound:   { enabled: false, daily_cap: 6, max_titles_per_run: 3, verify_on_detail: true }
  indeed:      { enabled: true,  daily_cap: 25, max_titles_per_run: 30, browser_channel: chrome, verify_on_detail: true }
  glassdoor:   { enabled: true,  daily_cap: 25, max_titles_per_run: 30, pages_per_title: 2, browser_channel: chrome, verify_on_detail: true }
  simplyhired: { enabled: true,  daily_cap: 25, max_titles_per_run: 30, browser_channel: chrome, verify_on_detail: true }
  linkedin:    { enabled: false, daily_cap: 0, mode: "manual" }  # NEVER automated

notify:
  # optional Telegram pings; leave empty for desktop notifications only.
  # Set real values in .env as TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  telegram_bot_token: ""
  telegram_chat_id: ""
